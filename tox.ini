[tox]
envlist =
    docs
    py{310,311,312,313,314,314t}-django{4.2,5.1,5.2,6.0,6.1}-es8.x
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314,py314t

[gh-actions:env]
DJANGO =
    4.2: django4.2
    5.1: django5.1
    5.2: django5.2
    6.0: django6.0
    6.1: django6.1

[testenv]
commands =
    coverage run {toxinidir}/test_haystack/run_tests.py
deps =
    pysolr>=3.7.0
    whoosh>=2.5.4,<3.0
    python-dateutil
    geopy==2.0.0
    coverage
    requests
    setuptools; python_version >= "3.12"  # Can be removed on pysolr >= v3.10
    django4.2: Django>=4.2,<4.3
    django5.1: Django>=5.1,<5.2
    django5.2: Django>=5.2,<6
    django6.0: Django>=6.0,<6.1
    django6.1: Django>=6.1,<6.2
    es8.x: elasticsearch>=8,<9
setenv =
    es8.x: VERSION_ES=>=8,<9

[testenv:docs]
changedir = docs
deps =
    sphinx
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
