name: Test
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff: # https://docs.astral.sh/ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --user ruff
      - run: ruff check --output-format=github

  test:
    name: Test (py${{ matrix.python-version }}, dj${{ matrix.django-version }}, es${{ matrix.elastic-version }})
    runs-on: ubuntu-latest
    needs: ruff # Do not run the tests if linting fails.
    strategy:
      fail-fast: false
      matrix: # https://docs.djangoproject.com/en/stable/faq/install/#what-python-version-can-i-use-with-django
        django-version: ["4.2", "5.1", "5.2", "6.0", "6.1"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        elastic-version: ["7.17.13"]
        include:
          - django-version: "5.2"
            python-version: "3.14"
            elastic-version: "7.17.13"
          - django-version: "5.2"
            python-version: "3.14t"
            elastic-version: "7.17.13"
          - django-version: "6.0"
            python-version: "3.14"
            elastic-version: "7.17.13"
          - django-version: "6.0"
            python-version: "3.14t"
            elastic-version: "7.17.13"
          - django-version: "6.1"
            python-version: "3.14"
            elastic-version: "7.17.13"
          - django-version: "6.1"
            python-version: "3.14t"
            elastic-version: "7.17.13"
        exclude:
          - django-version: "4.2"
            python-version: "3.13"
          - django-version: "6.0"
            python-version: "3.10"
          - django-version: "6.0"
            python-version: "3.11"
          - django-version: "6.1"
            python-version: "3.10"
          - django-version: "6.1"
            python-version: "3.11"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y gdal-bin

      - name: "Start Elasticsearch ${{ matrix.elastic-version }} and Solr 6
        env:
          ELASTICSEARCH_VERSION: ${{ matrix.elastic-version }}
          SOLR_VERSION: "6"
        run: docker compose -f docker/docker-compose.yml up --quiet-pull --wait --wait-timeout 120

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install coverage requests tox tox-gh-actions
          pip install django==${{ matrix.django-version }} elasticsearch==${{ matrix.elastic-version }}
          pip install --editable .

      - name: Run test
        run: tox -v
        env:
          DJANGO: ${{ matrix.django-version }}
